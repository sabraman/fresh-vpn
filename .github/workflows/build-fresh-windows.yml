name: Build Fresh VPN (Windows)

on:
  push:
    branches: [ fresh-vpn ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      QT_VERSION: 6.10.1
    steps:
      - name: Checkout (recursive submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install conan
        run: pip install "conan==2.28.0"

      - name: Conan profile + amnezia remote (anonymous read)
        shell: bash
        run: |
          conan profile detect --force
          conan remote add amnezia https://artifactory.amnezia.org/artifactory/api/conan/client-prebuilts || echo "remote exists"
          conan remote list

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtremoteobjects qt5compat qtshadertools
          dir: ${{ runner.temp }}
          setup-python: false
          set-env: true
          aqtversion: '==3.3.0'

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build (exe, Release)
        shell: cmd
        env:
          QT_INSTALL_DIR: ${{ runner.temp }}
        run: |
          deploy\build.bat

      - name: Stage clean app (exe + Qt runtime + OpenSSL) + zip
        shell: cmd
        run: |
          set "QTBIN=${{ runner.temp }}\Qt\%QT_VERSION%\msvc2022_64\bin"
          mkdir dist
          copy /y deploy\build\client\Release\AmneziaVPN.exe dist\
          if exist deploy\build\client\service\Release\AmneziaVPN-service.exe copy /y deploy\build\client\service\Release\AmneziaVPN-service.exe dist\
          if exist deploy\build\service\Release\AmneziaVPN-service.exe copy /y deploy\build\service\Release\AmneziaVPN-service.exe dist\
          "%QTBIN%\windeployqt.exe" --qmldir client\ui\qml --release --no-translations dist\AmneziaVPN.exe
          for /r "%USERPROFILE%\.conan2\p" %%f in (libcrypto-3-x64.dll) do @if exist "%%f" copy /y "%%f" dist\ >nul 2>&1
          for /r "%USERPROFILE%\.conan2\p" %%f in (libssl-3-x64.dll) do @if exist "%%f" copy /y "%%f" dist\ >nul 2>&1
          powershell -Command "Compress-Archive -Path dist\* -DestinationPath FreshVPN-windows.zip -Force"
          dir dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreshVPN-windows
          path: FreshVPN-windows.zip
          retention-days: 7
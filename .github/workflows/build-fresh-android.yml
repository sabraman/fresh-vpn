name: 'Build Fresh Android'

# Android is built on Linux on purpose: deploy/build.sh and the native deps
# (libxray, awg-android) are bash/Makefile based and do not build on Windows.
on:
  workflow_dispatch:
  push:
    branches:
      - android-build-2026-07

jobs:
  Build-Android:
    runs-on: ubuntu-latest

    env:
      QT_VERSION: 6.10.1
      NDK_VERSION: 27.2.12479018

    steps:
    - name: 'Get sources'
      uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 10

    - name: 'Setup Java'
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 'Setup Android SDK'
      uses: android-actions/setup-android@v3

    - name: 'Install NDK and platform'
      run: |
        sdkmanager --install "ndk;${NDK_VERSION}" "platforms;android-36" "build-tools;36.0.0"
        echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> $GITHUB_ENV

    - name: 'Install Qt (linux host tools)'
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'desktop'
        arch: 'linux_gcc_64'
        modules: 'qtremoteobjects qt5compat qtshadertools'
        dir: ${{ runner.temp }}
        setup-python: 'false'

    - name: 'Install Qt (android arm64)'
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'android'
        arch: 'android_arm64_v8a'
        modules: 'qtremoteobjects qt5compat qtshadertools'
        dir: ${{ runner.temp }}
        setup-python: 'false'

    - name: 'Setup python'
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: 'Install conan'
      run: |
        pip install "conan==2.28.0"
        conan profile detect --force

    - name: 'Install system packages'
      run: sudo apt-get update && sudo apt-get install -y ninja-build libsecret-1-dev

    - name: 'Build APK'
      shell: bash
      env:
        QT_INSTALL_DIR: ${{ runner.temp }}
      run: deploy/build.sh android --abi arm64-v8a

    - name: 'Show what was produced'
      if: ${{ always() }}
      shell: bash
      run: find . -name '*.apk' -o -name '*.aab' | head -20

    - name: 'Upload APK'
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: FreshVPN-android-arm64
        path: '**/*.apk'
        retention-days: 14
        if-no-files-found: warn
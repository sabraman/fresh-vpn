name: 'Fresh VPN - Android build (test APK)'

# Android build for the Fresh fork on GitHub-hosted ubuntu-latest (no private android-runner).
# Produces an UNSIGNED/debug APK for arm64-v8a (installs on most phones for testing).
# Release/Play-Store signing (keystore secret) is a later step.

on:
  workflow_dispatch:

env:
  QT_MIRROR: https://mirrors.ocf.berkeley.edu/qt/

jobs:
  Build-Android-Fresh:
    runs-on: ubuntu-latest

    env:
      ANDROID_PLATFORM: android-28
      NDK_VERSION: 27.0.11718014
      QT_VERSION: 6.10.3
      QT_MODULES: 'qtremoteobjects qt5compat qtimageformats qtshadertools'

    steps:
    - name: 'Get sources'
      uses: actions/checkout@v4
      with:
        submodules: 'true'

    - name: 'Install desktop Qt'
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'desktop'
        arch: 'linux_gcc_64'
        modules: ${{ env.QT_MODULES }}
        dir: ${{ runner.temp }}
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Install android_arm64_v8a Qt'
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'android'
        arch: 'android_arm64_v8a'
        modules: ${{ env.QT_MODULES }}
        dir: ${{ runner.temp }}
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Setup Java'
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 'Setup Android SDK'
      uses: android-actions/setup-android@v4
      with:
        packages: "platforms;${{ env.ANDROID_PLATFORM }} ndk;${{ env.NDK_VERSION }}"

    - name: 'Setup python'
      uses: actions/setup-python@v6
      with:
        python-version: 3.14

    - name: 'Install conan'
      run: pip install "conan==2.28.0"

    - name: 'Build project (unsigned debug APK, arm64-v8a)'
      shell: bash
      env:
        QT_INSTALL_DIR: ${{ runner.temp }}
      run: |
        deploy/build.sh -t android --abi arm64-v8a
        echo "---- APKs produced ----"
        find deploy/build -name "*.apk" -print

    - name: 'Upload APK'
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: FreshVPN-android-arm64-apk
        path: deploy/build/**/*.apk
        if-no-files-found: warn
        retention-days: 7

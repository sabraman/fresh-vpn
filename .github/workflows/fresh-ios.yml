name: 'Fresh VPN - iOS build (unsigned compile-check)'

# iOS compile-check on GitHub-hosted macos-latest.
# NO Apple signing secrets -> this verifies the reskin COMPILES on iOS.
# Installing on a real iPhone requires Apple Developer Program ($99/yr) + certs/provisioning
# (separate step: fresh-ios-signed.yml + IOS_SIGNING_CERT_BASE64 etc.).

on:
  workflow_dispatch:

env:
  QT_MIRROR: https://mirrors.ocf.berkeley.edu/qt/

jobs:
  Build-iOS-Fresh:
    runs-on: macos-latest

    env:
      QT_VERSION: 6.10.1

    steps:
    - name: 'Get sources'
      uses: actions/checkout@v4
      with:
        submodules: 'true'

    - name: 'Setup xcode'
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.0'

    - name: 'Install desktop Qt'
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ env.QT_VERSION }}
        host: 'mac'
        target: 'desktop'
        arch: 'clang_64'
        modules: 'qtremoteobjects qt5compat qtshadertools qtmultimedia'
        dir: ${{ runner.temp }}
        set-env: 'true'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Install iOS Qt'
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ env.QT_VERSION }}
        host: 'mac'
        target: 'ios'
        modules: 'qtremoteobjects qt5compat qtshadertools qtmultimedia'
        dir: ${{ runner.temp }}
        setup-python: 'true'
        set-env: 'true'
        extra: '--external 7z --base ${{ env.QT_MIRROR }}'

    - name: 'Setup python'
      uses: actions/setup-python@v6
      with:
        python-version: 3.14

    - name: 'Install deps'
      run: pip install "conan==2.28.0" jsonschema jinja2

    - name: 'Build project (unsigned compile-check)'
      env:
        QT_INSTALL_DIR: ${{ runner.temp }}
      run: |
        set -o pipefail
        # Capture the build result instead of blanket-masking it with "|| echo".
        sh deploy/build.sh -t ios 2>&1 | tee build_ios.log && BUILD_RC=0 || BUILD_RC=$?
        if [ "${BUILD_RC:-0}" -eq 0 ]; then
          echo "iOS build fully succeeded."
          exit 0
        fi
        # Non-zero: distinguish a REAL compile regression from the expected code-signing failure.
        if grep -qiE 'error: |fatal error|ld: |[Uu]ndefined symbol|CMake Error|compilation terminated' build_ios.log; then
          echo "::error::iOS COMPILE failure detected (not signing) - failing the compile-check."
          exit 1
        fi
        if grep -qiE 'code ?sign|provisioning|development team|Signing for' build_ios.log; then
          echo "::warning::iOS compiled OK; failed only at code-signing (expected for an unsigned compile-check)."
          exit 0
        fi
        echo "::error::iOS build failed for an unrecognized reason - failing so it gets reviewed."
        exit 1

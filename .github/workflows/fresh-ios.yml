name: 'Fresh VPN - iOS build (unsigned compile-check)'

# iOS compile-check on GitHub-hosted macos-latest.
# NO Apple signing secrets -> this verifies the reskin COMPILES on iOS.
# Installing on a real iPhone requires Apple Developer Program ($99/yr) + certs/provisioning
# (separate step: fresh-ios-signed.yml + IOS_SIGNING_CERT_BASE64 etc.).

on:
  workflow_dispatch:

env:
  QT_MIRROR: https://mirrors.ocf.berkeley.edu/qt/

jobs:
  Build-iOS-Fresh:
    runs-on: macos-latest

    env:
      QT_VERSION: 6.10.1

    steps:
    - name: 'Get sources'
      uses: actions/checkout@v4
      with:
        submodules: 'true'

    - name: 'Setup xcode'
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.0'

    - name: 'Install desktop Qt'
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ env.QT_VERSION }}
        host: 'mac'
        target: 'desktop'
        arch: 'clang_64'
        modules: 'qtremoteobjects qt5compat qtshadertools qtmultimedia'
        dir: ${{ runner.temp }}
        set-env: 'true'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Install iOS Qt'
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ env.QT_VERSION }}
        host: 'mac'
        target: 'ios'
        modules: 'qtremoteobjects qt5compat qtshadertools qtmultimedia'
        dir: ${{ runner.temp }}
        setup-python: 'true'
        set-env: 'true'
        extra: '--external 7z --base ${{ env.QT_MIRROR }}'

    - name: 'Setup python'
      uses: actions/setup-python@v6
      with:
        python-version: 3.14

    - name: 'Install deps'
      run: pip install "conan==2.28.0" jsonschema jinja2

    - name: 'Build project (unsigned compile-check)'
      env:
        QT_INSTALL_DIR: ${{ runner.temp }}
      run: |
        sh deploy/build.sh -t ios || echo "::warning::iOS build stopped (expected without signing) - this run is a compile-check only"
        echo "iOS compile-check finished. Device install needs Apple Developer signing."
